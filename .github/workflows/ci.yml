name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, test and verify (Windows)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Dentiva.sln

      - name: Build (Release)
        run: dotnet build Dentiva.sln -c Release --no-restore

      - name: Run unit and integration tests
        run: >
          dotnet test src/Dentiva.Tests/Dentiva.Tests.csproj -c Release --no-build
          --logger "trx;LogFileName=results.trx"
          --results-directory "$env:GITHUB_WORKSPACE\TestResults"

      - name: Publish app (framework-dependent)
        run: dotnet publish src/Dentiva.App/Dentiva.App.csproj -c Release -r win-x64 --self-contained false -o "$env:GITHUB_WORKSPACE\publish\app"

      - name: Application selftest (real exe, isolated data dir)
        run: '& "$env:GITHUB_WORKSPACE\publish\app\Dentiva.exe" --selftest --data-dir "$env:RUNNER_TEMP\qa-data"'

      - name: Check selftest result
        shell: pwsh
        run: |
          $path = "$env:RUNNER_TEMP\qa-data\selftest-result.json"
          if (-not (Test-Path $path)) { Write-Error "Selftest result file missing."; exit 1 }
          Get-Content $path

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-results
          path: |
            TestResults/**
            publish/
          retention-days: 7
