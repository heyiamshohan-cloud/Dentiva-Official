name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, test and verify (Windows)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore Dentiva.sln 2>&1 | Tee-Object -FilePath restore.log
          exit $LASTEXITCODE

      - name: Build (Release)
        shell: pwsh
        run: |
          dotnet build Dentiva.sln -c Release --no-restore 2>&1 | Tee-Object -FilePath build.log
          exit $LASTEXITCODE

      - name: Report build errors
        if: failure()
        shell: pwsh
        run: |
          foreach ($log in @('restore.log', 'build.log')) {
            if (Test-Path $log) {
              Select-String -Path $log -Pattern ': error ' |
                Select-Object -First 40 |
                ForEach-Object { Write-Output ("::error::{0}" -f $_.Line.Trim()) }
            }
          }

      - name: Run unit and integration tests
        shell: pwsh
        run: |
          dotnet test src/Dentiva.Tests/Dentiva.Tests.csproj -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory "$env:GITHUB_WORKSPACE\TestResults" 2>&1 | Tee-Object -FilePath test.log
          exit $LASTEXITCODE

      - name: Report test errors
        if: failure()
        shell: pwsh
        run: |
          Select-String -Path test.log -Pattern '(Failed|error|Failed!)' |
            Select-Object -First 40 |
            ForEach-Object { Write-Output ("::error::{0}" -f $_.Line.Trim()) }

      - name: Publish app (framework-dependent)
        shell: pwsh
        run: |
          dotnet publish src/Dentiva.App/Dentiva.App.csproj -c Release -r win-x64 --self-contained false -o "$env:GITHUB_WORKSPACE\publish\app" 2>&1 | Tee-Object -FilePath publish.log
          exit $LASTEXITCODE

      - name: Report publish errors
        if: failure()
        shell: pwsh
        run: |
          Select-String -Path publish.log -Pattern ': error ' |
            Select-Object -First 40 |
            ForEach-Object { Write-Output ("::error::{0}" -f $_.Line.Trim()) }

      - name: Application selftest (real exe, isolated data dir)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "$env:GITHUB_WORKSPACE\publish\app\Dentiva.exe" -ArgumentList '--selftest','--data-dir',"$env:RUNNER_TEMP\qa-data" -Wait -PassThru
          exit $p.ExitCode

      - name: Check selftest result
        shell: pwsh
        run: |
          $path = "$env:RUNNER_TEMP\qa-data\selftest-result.json"
          if (-not (Test-Path $path)) { Write-Error "Selftest result file missing."; exit 1 }
          Get-Content $path

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-results
          path: |
            TestResults/**
            publish/
          retention-days: 7
